name: Root guide and authority-boundary documentation
on:
  pull_request:
    paths:
      - "README.md"
      - ".github/workflows/readme-guides.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guide-links:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify root navigation and non-adoption boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path.cwd()
          text = (root / "README.md").read_text(encoding="utf-8")
          assert "fb3d97938969a89e149e8ff8db2756091d1233fc" in text
          assert "89e4722b0b7b9337d47f36afd28a28b076b128fd" in text
          assert "not institutional grant" in text.lower() or "not a grant" in text.lower()
          checked = 0
          for link in re.findall(r'\]\(([^)]+)\)', text):
              loc = link.split("#",1)[0]
              if not loc or loc.startswith(("https://","http://","mailto:")):
                  continue
              assert (root / loc).exists(), "missing local guide link: " + loc
              checked += 1
          print(f"Validated {checked} local root README links")
          PY
