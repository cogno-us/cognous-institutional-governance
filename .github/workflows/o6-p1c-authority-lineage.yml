name: O6 P1C authority lineage

on:
  pull_request:
    paths:
      - 'process/implementation/authority-lineage-v0.1/**'
      - 'testing/harness/run_authority_lineage.py'
      - 'testing/harness/requirements-authority-lineage.txt'
      - 'tests/test_authority_lineage.py'
      - '.github/workflows/o6-p1c-authority-lineage.yml'
  push:
    branches:
      - 'worker/o6-p1c-authority-lineage-schema'
    paths:
      - 'process/implementation/authority-lineage-v0.1/**'
      - 'testing/harness/run_authority_lineage.py'
      - 'testing/harness/requirements-authority-lineage.txt'
      - 'tests/test_authority_lineage.py'
      - '.github/workflows/o6-p1c-authority-lineage.yml'

permissions:
  contents: read

jobs:
  authority-lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r testing/harness/requirements-authority-lineage.txt
      - run: python -m unittest tests.test_authority_lineage -v
      - run: python testing/harness/run_authority_lineage.py > /tmp/authority-lineage-results.json
