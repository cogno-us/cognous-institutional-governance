    {
      "assumption": "CDR-001 through CDR-004 remain controlling commitments for this analysis.",
      "boundary": "Their adoption does not itself prove permanent immutability or predetermine which changes require amendment or refounding."
    },
    {
      "assumption": "Amendment and refounding are distinct constitutional acts.",
      "boundary": "Ordinary amendment cannot erase the distinction or declare identity-changing alteration to be continuous governance merely by following ordinary procedure."
    },
    {
      "assumption": "Artificial intelligence may assist but cannot authorize foundational change.",
      "boundary": "No artificial-intelligence system may independently authorize amendment or refounding, regardless of capability, validation, reliance, or effective control."
    },
    {
      "assumption": "Adjudication, emergency action, and succession remain bounded by their controlling CDRs.",
      "boundary": "Interpretation, necessity, continuity, or succession cannot silently perform amendment or refounding."
    },
    {
      "assumption": "Repository evidence is advisory and incomplete.",
      "boundary": "Historical persistence, prior adoption, popularity, or technical implementation does not determine constitutional entrenchment."
