      "name": "Reserved Human Sovereignty + Entrenched Constitutional Limits",
      "research_status": "CANDIDATE_NOT_SELECTED",
      "definition": "Human sovereignty over institutional ends is expressly reserved, while entrenched limits govern constituted power and may be changed only through a separately legitimate human refounding process.",
      "constitutional_distinction": {
        "sovereignty_over_institutional_ends": "Humans collectively retain final authority over institutional purposes, existence, and legitimate refounding; no machine or constituted office is superior to that sovereignty.",
        "constitutional_freedom_and_governed_exercise_of_institutional_power": "Humans and artificial intelligence systems exercising institutional power are governed by entrenched limits, and no ordinary human command is valid merely because it is human.",
        "machine_validity_and_constitutional_legitimacy": "Machines may enforce explicit limits and expose invalidity, but legitimate amendment, adjudication, and refounding remain human constitutional acts."
      },
      "dimensions": {
        "source_of_legitimacy": "Legitimacy rests on reserved human constituent sovereignty expressed through a constitutional settlement that distinguishes ordinary authority, amendment, and refounding.",
        "constraint_mechanism": "Entrenched substantive limits, source hierarchy, separated functions, explicit grants, human review, provenance, and refounding thresholds constrain every constituted actor.",
        "enforcement": "Institutionally separated human and technical controls may block acts outside grants or limits, subject to human review and disclosed enforcement boundaries.",
        "adjudication": "Authorized human adjudicators interpret entrenched limits without acquiring authority to redefine institutional ends or replace the constituent humans.",
        "appeal": "Appeal preserves human review, dissent, and correction; an adverse judgment may be changed by legitimate amendment where permitted or by explicit human refounding where entrenchment requires it.",
        "amendment": "Ordinary amendment operates within entrenched boundaries and cannot silently convert constituted amendment authority into constituent sovereignty.",
        "refounding": "A distinct, explicit, human-authorized process may alter entrenched principles or institutional ends, with continuity, provenance, and transition consequences separately addressed.",
        "succession": "Constituted offices follow precommitted succession rules, while loss or change of constituent human authority requires a higher-order continuity or refounding process.",
        "emergency": "Emergency authority remains narrow, temporary, reviewable, and unable to amend entrenched limits through operational necessity alone.",
        "effective_power": "The design seeks to observe and constrain divergence between formal grants and practical control, including dependency on reviewers, validators, operators, or artificial intelligence systems.",
        "incentives": "Entrenchment raises the cost of opportunistic change, while clear legitimate change paths reduce pressure to evade the constitution; excessive rigidity may reward informal circumvention.",
        "reversibility": "Ordinary actions and interpretations should remain reviewable, while changes to entrenched commitments are deliberately difficult and may require costly refounding.",
        "legibility": "A layered hierarchy can make authority and change pathways explicit, but distinctions among ordinary action, amendment, and refounding require sustained human comprehension.",
        "machine_implementability": "Explicit grants, source hierarchy, provenance, and some prohibitions are representable; legitimacy, contested meaning, constituent identity, and refounding cannot be conclusively automated."
      },
      "adversarial_tests": {
        "bad_human": {
          "abuse_scenario": "A human officeholder invokes human sovereignty to bypass an entrenched limit in an ordinary institutional act.",
          "prevention_or_limit": "Explicit competence boundaries, independent human review, separated enforcement, and a distinct refounding path deny ordinary validity to the command.",
          "residual_failure": "Humans may capture review, disable enforcement, or falsely characterize ordinary action as refounding.",
          "validity_legitimacy_boundary": "Human authorship does not make every command valid; only constitutionally competent action or legitimate refounding can alter the governing authority."
