  "assumptions": [
    {
      "assumption": "Foundational sovereignty and the exercise of institutional power are analytically distinct.",
      "boundary": "A human source may retain authority over institutional ends while particular commands remain constitutionally invalid, procedurally defective, or outside delegated competence."
    },
    {
      "assumption": "Human constitutional authority is not defined here as unconstrained command.",
      "boundary": "The glossary expressly states that the term does not imply unconstrained power or resolve how that authority is constituted."
    },
    {
      "assumption": "Machine validity and constitutional legitimacy remain distinct.",
      "boundary": "A validator, policy engine, credential, or executable rule may determine technical acceptance without becoming a sovereign source of legitimacy."
    },
    {
      "assumption": "Repository analogues are research evidence rather than proof.",
      "boundary": "Analogy does not establish transferability, and absence of a close analogue does not establish novelty."
    },
    {
      "assumption": "This record compares architectures without adopting constitutional text.",
      "boundary": "Candidate mechanisms, assessments, and attacks remain research inputs requiring explicit human constitutional judgment."
    }
