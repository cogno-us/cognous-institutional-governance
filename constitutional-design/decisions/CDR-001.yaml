          "prevention_or_limit": "Reserved human powers, bounded delegation, provenance, meaningful review, and nondelegable human authorization keep the machine from acquiring formal sovereignty.",
          "residual_failure": "Humans may become operationally dependent and ratify machine-framed choices without meaningful comprehension.",
          "validity_legitimacy_boundary": "Machine execution or validation can never supply the human constituent act required for sovereignty, amendment, or refounding."
