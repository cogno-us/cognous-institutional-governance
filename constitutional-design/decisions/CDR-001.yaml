          "prevention_or_limit": "Function separation, plural participation, dissent, transparency, provenance, and anti-concentration monitoring create multiple points of challenge.",
          "residual_failure": "Coordinated capture of all relevant human channels can defeat formal safeguards, and entrenchment can then protect the captured order.",
          "validity_legitimacy_boundary": "Procedural completion is evidence of validity but not conclusive legitimacy when constituency, independence, or comprehension has failed."
        },
        "emergency": {
          "abuse_scenario": "An imminent threat is used to suspend entrenched limits or to treat temporary necessity as refounding.",
          "prevention_or_limit": "Nonamendment by emergency, narrow scope, expiry, review, restoration, records, and remedies preserve the constitutional boundary.",
          "residual_failure": "A genuine crisis may outpace review, and strict entrenchment may block necessary action or prompt extraconstitutional conduct.",
          "validity_legitimacy_boundary": "Operational necessity may justify only the authority actually granted; it cannot automatically create a legitimate constituent act."
        },
        "succession": {
          "abuse_scenario": "Foundational human authority becomes unavailable or contested while entrenched rules require human action.",
          "prevention_or_limit": "Precommitted office succession and continuity rules preserve constituted functions without transferring constituent sovereignty to machines.",
          "residual_failure": "The repository does not resolve who may act when constituent humans themselves are absent, divided, or illegible.",
          "validity_legitimacy_boundary": "A valid continuity mechanism can preserve administration but cannot manufacture a new legitimate human sovereign."
