          "prevention_or_limit": "Human-readable authority, independent review, multiple implementations, audit, explicit indeterminacy, and human override through legitimate procedures constrain the validator.",
          "residual_failure": "Complexity and infrastructure dependence can make formal human supremacy nominal while maintainers hold effective control.",
          "validity_legitimacy_boundary": "Machine rejection or approval is an enforcement event subject to human constitutional review, never a source superior to human sovereignty."
