          "prevention_or_limit": "Source hierarchy, explicit precedent status, dissent, anti-accretion review, supersession, and refounding triggers make changes traceable.",
          "residual_failure": "Interpretation remains capable of narrowing limits, and excessive rigidity can push change into informal practice.",
          "validity_legitimacy_boundary": "A technically applied precedent cannot legitimately perform constitutional change reserved to amendment or refounding."
