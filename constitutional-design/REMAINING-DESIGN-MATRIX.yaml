        "architecture": "Define constitutional membership as every adult natural person who, immediately before the initiation event for a constitutional exercise, was either subject to the institution's claimed authority or within the institution's published class of ultimate human beneficiaries; categorically exclude artificial intelligence. The initiation event is filing for a proposal or case, publication of notice for an office-selection exercise, filing of a succession trigger, or opening of transition nominations; any other constitutional exercise begins with public notice identifying its purpose and closes the roll before participation starts. A public pre-event roll is rebuttable evidence rather than the source of membership, and exclusion or inclusion is reviewable before the exercise proceeds. Provide four standing channels: direct standing for personal constitutional injury, representative standing with attributable authorization from represented members, public-interest standing for material institutional violations, and office standing within assigned functions. Constitutionally separate authorization, adjudication, enforcement, evidence validation, independent verification, succession administration, and transition custody; no office combines final judgment with enforcement or evidence control.",
